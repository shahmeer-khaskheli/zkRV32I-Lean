name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Lean build
        uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.elan
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('formal/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            adversarial/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lean-version: leanprover/lean4:v4.19.0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install RISC-V target
        run: rustup target add riscv32i-unknown-none-elf

      - name: Verify pinned toolchains
        run: |
          lean --version
          lake --version
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Run full verification gate
        run: bash scripts/verify_all.sh
